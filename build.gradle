plugins {
    id 'java-library'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
}

group = mod_group_id
version = mod_version

base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
java.withSourcesJar()

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven { url = 'https://api.modrinth.com/maven' }
    maven { url = 'https://maven.createmod.net' }
    maven { url = 'https://maven.ithundxr.dev/snapshots' }
    maven { url = 'https://maven.blamejared.com' }
}

neoForge {
    version = neo_version
    validateAccessTransformers = true

    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
        gameTestServer { type = 'gameTestServer' }
        data {
            data()
            programArguments.addAll '--mod', mod_id, '--all', '--output', file('src/generated/resources/').absolutePath, '--existing', file('src/main/resources/').absolutePath
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" { sourceSet sourceSets.main }
    }
}

configurations { runtimeClasspath.extendsFrom localRuntime }

dependencies {
    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
    implementation "net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}"
    compileOnly "dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}"
    runtimeOnly "dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}"
    implementation "com.tterrag.registrate:Registrate:${registrate_version}"

    compileOnly "maven.modrinth:kaleidoscope-cookery:${kaleidoscope_cookery_version}"
    localRuntime "maven.modrinth:kaleidoscope-cookery:${kaleidoscope_cookery_version}"
    compileOnly "maven.modrinth:kaleidoscopetavern:${kaleidoscope_tavern_version}"
    localRuntime "maven.modrinth:kaleidoscopetavern:${kaleidoscope_tavern_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
        neo_version: neo_version, loader_version_range: loader_version_range,
        mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
        mod_authors: mod_authors, mod_description: mod_description]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) { expand replaceProperties + [project: project] }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

idea.module { downloadSources = true; downloadJavadoc = true }

tasks.register('publishSnapshot') {
    group = 'publishing'
    description = 'Publish SNAPSHOT with a fixed (non-timestamped) filename, overwriting the previous snapshot.'
    dependsOn 'jar', 'sourcesJar', 'generatePomFileForModJarPublication'

    doLast {
        def nexusUrl = (project.findProperty('nexusUrl') ?: 'https://maven.sshakusora.com/repository/kaleidoscope-contraption').toString()
        def user = project.findProperty('nexusUsername') ?: 'admin'
        def pass = project.findProperty('nexusPassword') ?: ''
        def groupPath = project.group.replace('.', '/')
        def mavenVersion = "${minecraft_version}-${project.version}"
        def fileName = "${mod_id}-${mavenVersion}"
        def baseDir = "${nexusUrl}/${groupPath}/${mod_id}/${mavenVersion}"
        def auth = java.util.Base64.getEncoder().encodeToString("${user}:${pass}".getBytes('UTF-8'))

        def upload = { File f, String name ->
            def conn = (HttpURLConnection) new URL("${baseDir}/${name}").openConnection()
            conn.requestMethod = 'PUT'
            conn.doOutput = true
            conn.setRequestProperty('Authorization', "Basic ${auth}")
            conn.setRequestProperty('Content-Type', name.endsWith('.pom') ? 'application/xml' : 'application/java-archive')
            f.withInputStream { conn.outputStream.withStream { out -> out << it } }
            def code = conn.responseCode
            if (code >= 300) throw new GradleException("Upload failed (${code}) for ${name}")
            println "Uploaded ${name} (${code})"
        }

        upload(tasks.named('jar').get().archiveFile.get().asFile, "${fileName}.jar")
        upload(tasks.named('sourcesJar').get().archiveFile.get().asFile, "${fileName}-sources.jar")
        upload(layout.buildDirectory.file('publications/modJar/pom-default.xml').get().asFile, "${fileName}.pom")
    }
}

publishing {
    publications {
        modJar(MavenPublication) {
            groupId = project.group
            artifactId = mod_id
            version = "${minecraft_version}-${project.version}"
            artifact jar
            artifact sourcesJar
            pom {
                name = mod_name
                description = mod_description
                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://opensource.org/licenses/MIT'
                    }
                }
                developers {
                    developer {
                        id = 'sshakusora'
                        name = mod_authors
                    }
                }
            }
        }
    }
    repositories {
        maven {
            name = 'Nexus'
            url = uri(project.findProperty('nexusUrl') ?: 'https://maven.sshakusora.com/repository/kaleidoscope-contraption')
            credentials {
                username = project.findProperty('nexusUsername') ?: 'admin'
                password = project.findProperty('nexusPassword') ?: ''
            }
        }
    }
}
